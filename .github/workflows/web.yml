name: Build check

# Builds every pull request the way the deploy does, so a PR that would break the site fails here.
# It never deploys: GitHub Pages deployment is deploy.yml's job, on pushes to master only (the
# github-pages environment refuses deployments from any other branch).
on:
  pull_request:

permissions:
  contents: read

# A new push to the PR supersedes the build still running for it. Grouped per PR, so it can never
# cancel another PR's build or the master deploy.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get supported target version artifacts
        run: |
            bash get_artifacts.sh
      - name: Build
        run: npm install && npm run build
